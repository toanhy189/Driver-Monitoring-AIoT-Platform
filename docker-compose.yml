version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dms_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx:latest
    container_name: dms_emqx
    restart: always
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
    ports:
      - "1883:1883"
      - "8083:8083" # WebSocket
      - "8084:8084" # WSS
      - "8883:8883" # SSL/TLS
      - "18083:18083" # Dashboard

volumes:
  postgres_data:
