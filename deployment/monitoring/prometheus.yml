global:
  scrape_interval: 10s
scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: [backend:8000]
  - job_name: edge-ai
    static_configs:
      - targets: [host.docker.internal:9108]
