; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = development
# Chuyển toàn bộ dữ liệu biên dịch, toolchains, packages của PlatformIO sang ổ D
core_dir = D:/.platformio
workspace_dir = D:/.pio_build

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
# Cấu hình tốc độ truyền dữ liệu giữa ESP32 và máy tính qua USB
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson

[env:development]
build_src_filter =
    -<*>
    +<app/>

[env:test]
build_src_filter =
    -<*>
    +<tests/>
