; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; Match the Arduino 2.0.17 toolchain used by the verified firmware builds.
; Unpinned espressif32 8.x selects Arduino 3.x and incompatible mbedTLS APIs.
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
#cấu hình tốc đồ truyền dữ liệu giữa ESP32 và máy tính qua USB
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson

[env:test]
build_src_filter =
    -<*>
    +<tests/>

[env:development]
build_src_filter =
    -<*>
    +<app/>

[env:ota-release]
extends = env:development
build_flags = -D APP_FIRMWARE_VERSION=\"0.4.1\"

[env:ota-demo-043]
extends = env:development
build_flags =
    -D APP_FIRMWARE_VERSION=\"0.4.3\"
    -D APP_BOOT_DIAGNOSTICS=1

[env:ota-fault]
extends = env:development
build_flags =
    -D APP_FIRMWARE_VERSION=\"0.4.2-test-fail\"
    -D OTA_SELF_TEST_FORCE_FAIL=1
