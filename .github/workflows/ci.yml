name: Project CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  DATABASE_URL: postgresql+psycopg://test:test@localhost/test
  SECRET_KEY: ci-only-no-deployment-access
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m unittest discover -s backend/tests -v
      - name: Pull disposable test services
        run: |
          docker pull postgres:16
          docker pull eclipse-mosquitto:2
      - name: PostgreSQL MQTT HTTP permission and policy integration
        run: python backend/tests/run_week4_isolated.py --regression
      - name: PostgreSQL concurrent rule binding and ACK preservation
        run: python backend/tests/run_rule_binding_postgres.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration
          path: edge-ai/ml-runs/merge-main-20261108/*.json
  ai-test:
    needs: backend-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: edge-ai/requirements-lock.txt
      - run: python -m pip install -r edge-ai/requirements-lock.txt
      - run: python edge-ai/main.py --check
      - run: python -m unittest discover -s edge-ai/tests -v
  frontend-build:
    needs: ai-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: node --test frontend/tests/*.test.mjs
      - run: npm --prefix frontend run build
  firmware-build:
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install platformio
      - run: python -m platformio run -d firmware/esp32-alert-node -e development
  docker-validation:
    needs: [frontend-build, firmware-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: python deployment/mqtt/prepare_env.py
      - run: docker compose --env-file .env -f deployment/docker-compose.yml config --quiet
      - run: docker compose --env-file .env -f deployment/docker-compose.yml -f deployment/docker-compose.monitoring.yml config --quiet
      - run: docker compose --env-file .env -f deployment/docker-compose.yml -f deployment/docker-compose.tls.yml config --quiet
  docker-build:
    needs: docker-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: python deployment/mqtt/prepare_env.py
      - run: docker compose --env-file .env -f deployment/docker-compose.yml build backend frontend time-server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Disposable backend restart and persistence
        run: |
          docker pull postgres:16
          docker pull eclipse-mosquitto:2
          python backend/tests/run_week4_isolated.py --restart-only
