name: Edge AI and policy checks
on:
  pull_request:
    paths: ['edge-ai/**', 'backend/**', '.github/workflows/edge-ai.yml']
  push:
    paths: ['edge-ai/**', 'backend/**', '.github/workflows/edge-ai.yml']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  DATABASE_URL: postgresql+psycopg://test:test@localhost/test
  SECRET_KEY: ci-only-no-deployment-access
jobs:
  ai-without-camera:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: edge-ai/requirements-lock.txt
      - run: python -m pip install -r edge-ai/requirements-lock.txt
      - run: python edge-ai/main.py --check
      - run: python -m unittest discover -s edge-ai/tests -v
  policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt httpx websockets
      - run: python -m unittest discover -s backend/tests -v
